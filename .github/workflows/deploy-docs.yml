name: Deploy Docs

# docs/ または src/ が変更されたとき（main への push）と、手動実行で起動する
on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "src/**"
  workflow_dispatch:

# GitHub Pages（gh-pages ブランチ）へ書き込むための権限
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 日本語フォントを導入（グラフの日本語表示用）
        run: sudo apt-get update && sudo apt-get install -y fonts-ipaexfont

      - name: 依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          pip install "jupyter-book<2" ghp-import
          pip install .          # py4conjoint 本体（ドキュメントのコード実行に必要）

      - name: ドキュメントをビルド
        run: jupyter-book build docs/

      - name: GitHub Pages へ公開
        run: ghp-import -n -p -f docs/_build/html
        env:
          GIT_COMMITTER_NAME: github-actions
          GIT_COMMITTER_EMAIL: github-actions@github.com
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: github-actions@github.com
