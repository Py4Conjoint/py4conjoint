[build-system]
# license = "MIT"（PEP 639 の SPDX 文字列）には setuptools >= 77 が必要
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py4conjoint"
version = "0.5.0"
description = "評点型・選択型コンジョイント分析を Python 初心者でも直感的に行えるパッケージ"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.21",
    "scipy>=1.8",
    "statsmodels>=0.13",
    "matplotlib>=3.4",
]
keywords = ["conjoint", "survey", "marketing", "pandas", "japanese", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: Japanese",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1.5"]
excel-fast = ["python-calamine>=0.6; python_version>='3.10'"]
test = ["pytest>=7.0", "openpyxl>=3.1.5", "python-calamine>=0.2"]

[project.urls]
Homepage = "https://github.com/Py4Conjoint/py4conjoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes（未使用変数・importなど）
    "I",    # isort（import順序）
    "UP",   # pyupgrade（古い構文の検出）
]
ignore = [
    "E501",  # line too long（line-lengthで管理するため）
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# Markdown 内のコード例とノートブックは整形しない。
# 教材として、プロファイルごとの値を縦に並べるなど、意図的な整列で
# 「どの値がどの行に対応するか」を示している箇所があるため。
# docs/ は書き直し予定のため当面除外する（内容が確定したら見直す）。
# ディレクトリは "docs" ではなく "docs/**" と書くこと。ここのパターンは
# ファイルのパス全体と照合されるため、"docs" では一致せず、警告も出ないまま
# 整形されてしまう（"*.md" はファイル名と一致するので効く）。
exclude = ["*.md", "*.ipynb", "docs/**"]
